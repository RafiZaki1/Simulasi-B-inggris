name: Validasi data soal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validasi JSON & bangun ulang data/*.js
        run: python tools/build_data.py

      - name: Pastikan data/*.js sudah sinkron dengan JSON
        run: |
          if ! git diff --quiet -- data; then
            echo "::error::data/*.js belum sinkron. Jalankan 'python tools/build_data.py' lalu commit hasilnya."
            git diff --stat -- data
            exit 1
          fi
          echo "data/*.js sinkron dengan data/*.json"
